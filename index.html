<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
  <meta name="description" content="A fast-paced 2D arcade game. Dodge enemies, collect power-ups, and survive as long as possible!" />
  <meta name="theme-color" content="#111" />
  <title>Dodge & Survive</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <canvas id="gameCanvas" width="480" height="640"></canvas>

  <div id="touchControls">
    <button id="leftBtn" aria-label="Move left">&#9664;</button>
    <div id="centerButtons">
      <button id="shootBtn" aria-label="Shoot">&#9733;</button>
      <button id="pauseBtn" aria-label="Pause">&#9646;&#9646;</button>
    </div>
    <button id="rightBtn" aria-label="Move right">&#9654;</button>
  </div>

  <audio id="bg-music" src="sounds/bg.mp3" loop preload="auto"></audio>
  <audio id="hit-sound" src="sounds/hit.wav" preload="auto"></audio>
  <audio id="spawn-sound" src="sounds/spawn.wav" preload="auto"></audio>

  <script src="script.js"></script>
</body>
</html>
